{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="inline">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.path }}">
  {% get_current_language as CURRENT_LANGUAGE %}
  {% get_available_languages as AVAILABLE_LANGUAGES %}
  <select name="language" onchange="this.form.submit()"
          aria-label="{% trans 'Language' %}"
          class="bg-transparent text-cream text-[13px] border border-gold/40 rounded px-2 py-1">
    {% for code, name in AVAILABLE_LANGUAGES %}
      <option value="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>{{ code|upper }}</option>
    {% endfor %}
  </select>
</form>
